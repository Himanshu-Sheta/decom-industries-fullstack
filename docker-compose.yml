# ============================================================
# Decom Industries — Local Development Docker Infrastructure
# Step 2: PostgreSQL 16 Database + Adminer Web UI
# (In Step 8, we will also add the Backend & Frontend services!)
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: decom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decom_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-decom_store}
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    volumes:
      # Named volume keeps your database data even if you delete/recreate the container
      - decom_pg_data:/var/lib/postgresql/data
    networks:
      - decom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decom_admin} -d ${POSTGRES_DB:-decom_store}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: decom-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - decom-network

volumes:
  decom_pg_data:

networks:
  decom-network:
    driver: bridge
